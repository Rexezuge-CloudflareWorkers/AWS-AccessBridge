name: Upstream Sync

on:
  schedule:
    # Deliberately off the hour. Scheduled jobs queued at `:00` are delayed and can
    # be dropped under load — the fork's weekly syncs stopped firing that way — and
    # changing the value restarts a schedule that has silently stopped.
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.event.repository.fork }}
    name: Sync From Upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Sync Changes
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@9e2e4fd0829a2fe8ca4b13693faac9230c414d51 # v3.4
        with:
          upstream_sync_repo: Rexezuge-CloudflareWorkers/AWS-AccessBridge
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          test_mode: false

      - name: Trigger Continuous Integration
        if: steps.sync.outputs.has_new_commits == 'true'
        uses: ./.github/actions/retry-step
        with:
          command: gh api repos/${{ github.repository }}/dispatches --method POST -f event_type='Upstream Sync Integration'
          max_attempts: '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
