name: Continuous Integration

permissions:
  contents: read

on:
  repository_dispatch:
    types:
      - Upstream Sync Integration
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: continuous-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck and lint are separate jobs rather than one job running both, so a
  # failure names the tool that broke and a retry re-runs only that half. They
  # share nothing: `noEmit` everywhere, no project references, and ESLint builds
  # its own TS program via `projectService`, so neither consumes the other's
  # output.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Run Typecheck
        uses: ./.github/actions/retry-step
        with:
          command: pnpm run typecheck
          max_attempts: '2'

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Run Lint
        uses: ./.github/actions/retry-step
        with:
          command: pnpm run lint
          max_attempts: '2'

  migrations:
    name: Migration Lock
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      # Its own job rather than a step in `typecheck` or `lint`, so a failure
      # names migrations instead of arriving inside a typecheck or lint log.
      # Editing an already-applied migration is invisible to every other check:
      # the deploy succeeds, fresh databases pick up the edited statements, and
      # production keeps the schema it had.
      - name: Verify Migration Lock
        uses: ./.github/actions/retry-step
        with:
          command: pnpm run validate:migrations
          max_attempts: '2'

  god-files:
    name: God Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      # Its own job, like `migrations` and `locales`: a file growing past the
      # limit is invisible to typecheck, lint, and the tests — they all pass
      # perfectly well on a 500-line component. A separate job so the failure says
      # "god-file" rather than arriving inside a lint log.
      - name: Check God Files
        uses: ./.github/actions/retry-step
        with:
          command: pnpm run check:god-files
          max_attempts: '2'

  locales:
    name: Locales
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      # A locale defect is invisible to the unit tests: the catalogs are data, and
      # a key that is missing from eleven bundles still typechecks and still
      # builds. Its own job so a failure says "locales" rather than arriving
      # inside a typecheck log.
      - name: Validate Locale Bundles
        uses: ./.github/actions/retry-step
        with:
          command: pnpm run validate:locales
          max_attempts: '2'

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Run Tests with Coverage
        uses: ./.github/actions/retry-step
        with:
          command: pnpm run test:coverage
          max_attempts: '2'

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Run Integration Tests
        uses: ./.github/actions/retry-step
        with:
          command: pnpm run test:integration
          max_attempts: '2'

  # The only job with a service container. Everything else in this workflow runs
  # offline; this one puts the real AWS parsers in front of Floci, a
  # LocalStack-compatible emulator, so a drifted response shape fails here
  # instead of in production. Every other suite feeds our clients hand-written
  # stub bodies, which by construction cannot tell us AWS stopped matching the
  # regexes in `provider-clients`.
  #
  # `test/floci/**` is excluded from the root Vitest projects, so `pnpm test` and
  # `pnpm run checks` stay container-free and this job is the only thing that
  # needs the emulator.
  floci-smoke:
    name: Floci Smoke Tests
    runs-on: ubuntu-latest
    # Same value the harness defaults to; stated here because a service
    # container's published port is the contract between the two halves of this
    # job, and a reader should not have to open the helper to find it. Job-level
    # because a composite action cannot take `env` on its `uses` step.
    env:
      FLOCI_ENDPOINT: http://127.0.0.1:4566

    services:
      floci:
        # Pinned, not `latest`. This emulator is a floating dependency whose
        # releases change behaviour under us — 2.2.0 shipped the morning this was
        # last red — and a job that breaks because a tag moved is a job nobody
        # trusts. Bump deliberately, and read the release notes for anything
        # under services the suite exercises.
        image: floci/floci:2.2.0
        ports:
          - 4566:4566
        # RDS in metadata-only mode: instances and clusters are created as
        # records with no backing container and no auth proxy.
        #
        # This is what the suite needs, and it is also *much* cheaper than the
        # alternative. No Docker socket is mounted here on purpose, and the
        # no-daemon path is not free: `CreateDBInstance` reaches for Docker
        # before it gives up, and since 2.2.0 every Docker call is retried
        # inside the emulator (six attempts, 500ms exponential backoff capped
        # at 8s, any `IOException` counted as transient — a missing socket is
        # exactly that). One seeded create therefore spent ~30s of retry
        # backoff reaching the same metadata record this flag returns
        # immediately, which is what timed the RDS collector test out at both
        # 30s and 60s. A real engine would mean a `postgres:16-alpine` pull and a
        # container start on every run to learn nothing the parser does not
        # already learn from the metadata response.
        env:
          FLOCI_SERVICES_RDS_MOCK: 'true'
        # No `options:` — deliberately no health-check override. The tag is the
        # *native* image, built on `registry.access.redhat.com/ubi9-micro`: no
        # shell, no `curl`, no `wget`. Two failed runs established this the hard
        # way, and the failure mode is invisible from the outside: a
        # `--health-cmd` naming a missing binary makes Docker mark the container
        # unhealthy on the first probe, and GitHub reports only "Failed to
        # initialize container floci/floci:2.2.0", which reads like a broken
        # image rather than a broken health command.
        #
        # Overriding is not merely unnecessary but unsafe. Docker runs a
        # `--health-cmd` string through `/bin/sh -c` *inside* the container, and
        # ubi9-micro ships no `/bin/sh`, so even a correct script path wrapped in
        # `|| exit 1` would fail. The image already declares its own check in
        # exec form — `HEALTHCHECK CMD ["/usr/local/bin/healthcheck.sh"]`, a
        # bash `/dev/tcp` probe written specifically because the base has no
        # HTTP client — so omitting `options:` both keeps fail-fast and removes
        # our dependence on the image's internals entirely.
        #
        # Readiness that the container check does not cover is absorbed by the
        # suite's own probe (`test/floci/global-setup.ts`), which retries for 60s
        # and names the container-health-check case explicitly.
        #
        # Not overriding the container command either: the shipped `CMD` binds
        # 0.0.0.0 under `-Dfloci.security.allow-unsafe-network-exposure`, which is
        # what makes a published port reachable at all.

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      # The image is pinned, so a red run is our regression until proven
      # otherwise — `max_attempts: 2` exists only to absorb a slow first boot,
      # not to paper over a flaky assertion.
      - name: Run Floci Smoke Tests
        uses: ./.github/actions/retry-step
        with:
          command: pnpm run test:floci
          max_attempts: '2'

  # Only the SPA build. The API worker is typechecked by the `typecheck` job
  # (`pnpm -r typecheck` reaches `apps/api`), so repeating it here ran the same
  # `tsc --noEmit` against the same tsconfig a second time.
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Build Web App
        run: pnpm --filter @aws-access-bridge/web build

  # Verifies the shell the API worker *serves*, which is a different artifact from
  # `apps/web/dist/` — it is embedded into `apps/api/src/generated/spa-shell.ts` by the
  # Vite plugin, and both are gitignored. A stale-but-present shell is a deploy that
  # serves yesterday's operator UI.
  #
  # Its own job, and it builds first rather than depending on `build-web`, so the
  # failure says "the served shell is wrong" instead of arriving inside a build log.
  # That costs a second Vite build per run; the alternative — verifying inside
  # `build-web` — is free and is the trade being made here.
  #
  # The build is a **precondition**, not a convenience: a fresh checkout has neither
  # `apps/web/dist/` nor `apps/api/src/generated/`, and `postinstall` writes a
  # deliberately minimal stub so `tsc` can resolve `SPA_HTML` before anyone has built.
  # Verifying without building cannot pass, and fails with precisely the message the
  # check exists to give.
  spa-shell:
    name: Verify SPA Shell
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Build Web App
        run: pnpm --filter @aws-access-bridge/web build

      - name: Verify The SPA Shell
        uses: ./.github/actions/retry-step
        with:
          command: pnpm run verify:spa-shell
          max_attempts: '2'

  dependabot-auto-merge:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.state == 'open' && !github.event.repository.fork }}
    name: Auto-Merge Dependabot PR
    needs:
      - typecheck
      - lint
      - migrations
      - god-files
      - locales
      - unit-tests
      - integration-tests
      - floci-smoke
      - build-web
      - spa-shell
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Enable Auto-Merge
        uses: ./.github/actions/retry-step
        with:
          command: gh pr merge --auto --merge "$PR_URL"
          max_attempts: '5'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}

  dispatch-upstream-sync-deployment:
    if: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'Upstream Sync' }}
    name: Dispatch Upstream Sync Deployment
    needs:
      - typecheck
      - lint
      - migrations
      - god-files
      - locales
      - unit-tests
      - integration-tests
      - floci-smoke
      - build-web
      - spa-shell
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Dispatch Deployment
        uses: ./.github/actions/retry-step
        with:
          command: >
            printf '{"event_type":"Upstream Sync Deployment","client_payload":{"branch":"%s","sha":"%s"}}\n'
            "$PAYLOAD_BRANCH" "$PAYLOAD_SHA"
            | gh api repos/${{ github.repository }}/dispatches --method POST --input -
          max_attempts: '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAYLOAD_BRANCH: ${{ github.event.client_payload.branch || 'main' }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha || github.sha }}
