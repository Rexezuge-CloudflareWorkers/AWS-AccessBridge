# $version: v5-1771213470
name: Backup Main Branch to Azure DevOps

permissions:
  contents: read

on:
  push:
    branches:
      - main

jobs:
  backup-main-to-azure-devops:
    if: ${{ !github.event.repository.fork }}
    name: Backup main Branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "Actions"
          git config user.email "actions@github.com"

      - name: Set Up SSH for Backup Repo
        env:
          SSH_PRIVATE_KEY: ${{ secrets.BACKUP_REPO_AZURE_DEVOPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
          # Ensure ssh-agent is running
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

      - name: Add SSH Remote
        run: git remote add backup "${{ secrets.BACKUP_REPO_AZURE_DEVOPS_REPO_URL }}"

      - name: Push main Branch to Azure DevOps
        uses: ./.github/actions/retry-step
        with:
          command: git push --force backup main:main
          max_attempts: '3'
